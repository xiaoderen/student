<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户注册</title>
  <style>
    body {
      background: #f5f6fa;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .register-container {
      width: 370px;
      margin: 80px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 30px 30px 30px;
    }
    h2 {
      text-align: center;
      color: #2d3436;
      margin-bottom: 30px;
    }
    label {
      display: block;
      margin-bottom: 10px;
      color: #636e72;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #dfe6e9;
      border-radius: 5px;
      font-size: 16px;
      background: #f1f2f6;
    }
    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border: 1px solid #dfe6e9;
      border-radius: 5px;
      font-size: 16px;
      background: #f1f2f6;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #00b894;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #55efc4;
    }
    .login-link {
      text-align: center;
      margin-top: 18px;
    }
    .login-link a {
      color: #0984e3;
      text-decoration: none;
    }
    .error-message {
      color: #d63031;
      text-align: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
<div class="register-container">
  <h2>用户注册</h2>
  <form th:action="@{/register}" method="post">
    <label>用户名</label>
    <input type="text" name="username" required>
    <label>密码</label>
    <input type="password" name="password" required>
    <label>真实姓名</label>
    <input type="text" name="realName" required>
    <label>角色</label>
    <select name="role" required>
      <option value="">请选择角色</option>
      <option value="STUDENT">学生</option>
      <option value="TEACHER">教师</option>
    </select>
    <button type="submit">注册</button>
  </form>
  <div class="login-link">
    <a th:href="@{/login}">已有账号？去登录</a>
  </div>
  <div class="error-message" th:if="${error}" th:text="${error}"></div>
</div>
</body>
</html>
