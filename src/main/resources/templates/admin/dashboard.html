<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理面板 - 考勤系统</title>
    <link href="/webjars/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .welcome-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .action-btn {
            font-size: 18px;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .role-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-left: 10px;
        }
        .role-admin {
            background-color: #ff6b6b;
        }
        .role-teacher {
            background-color: #4ecdc4;
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="welcome-card text-center">
        <h1>💼 考勤系统管理面板</h1>
        <p class="mb-0">
            欢迎，<span th:text="${user.realName}"></span>
            <span class="role-badge"
                  th:classappend="${user.role.name() == 'ADMIN'} ? 'role-admin' : 'role-teacher'"
                  th:text="${user.role.name() == 'ADMIN'} ? '管理员' : '教师'"></span>
        </p>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">👨‍🎓 学生信息管理</h4>
        </div>
        <div class="card-body text-center">
            <a th:href="@{/admin/students/add}" class="btn btn-success action-btn">
                ➕ 新增学生
            </a>
            <a th:href="@{/admin/students}" class="btn btn-primary action-btn">
                📋 学生列表
            </a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">📊 考勤记录管理</h4>
        </div>
        <div class="card-body text-center">
            <a th:href="@{/admin/attendance}" class="btn btn-info action-btn">
                🔍 查询考勤记录
            </a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">📚 选课管理</h4>
        </div>
        <div class="card-body text-center">
            <a th:href="@{/admin/course-selections}" class="btn btn-success action-btn">
                📤 批量导入选课
            </a>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/logout}" class="btn btn-outline-danger">退出登录</a>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
