<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
    <style>
        body {
            background: #f5f6fa;
            font-family: "Segoe UI", Arial, sans-serif;
        }
        .login-container {
            width: 350px;
            margin: 80px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 40px 30px 30px 30px;
        }
        h2 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            color: #636e72;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            font-size: 16px;
            background: #f1f2f6;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0984e3;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #74b9ff;
        }
        .register-link {
            text-align: center;
            margin-top: 18px;
        }
        .register-link a {
            color: #0984e3;
            text-decoration: none;
        }
        .error-message {
            color: #d63031;
            text-align: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h2>用户登录</h2>
    <form th:action="@{/login}" method="post">
        <label>用户名</label>
        <input type="text" name="username" required>
        <label>密码</label>
        <input type="password" name="password" required>
        <button type="submit">登录</button>
    </form>
    <div class="register-link">
        <a th:href="@{/register}">没有账号？去注册</a>
    </div>
    <div class="error-message" th:if="${param.error}" th:text="'用户名或密码错误'"></div>
</div>
</body>
</html>
